# Bundle self-activation patch: when this package is installed into a profile
# via `dsh plugin --profile <name> add dsh-plugin-general-improvements` (or a
# local checkout / git URL), this patch mounts the plugin's host half. The
# client half is discovered automatically from the `dsh.client` declaration in
# package.json.
#
# ONE registration per plugin. If the profile is managed by configuration
# management that renders its own `insert` row into the profile's
# cordis.patch.yml, make sure this package is not also registered there or in
# `dsh.profile.bundles`: the loader treats a duplicate entry id as fatal, the
# process exits 1 at boot, a supervisor restart-loops it, and any reverse
# proxy in front returns 502.
- insert:
    - id: general-improvements
      name: dsh-plugin-general-improvements
    # Improvement 2: current time in the model's context. DSH's own opt-in
    # clock plugin, mounted in no profile by default.
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        refreshIntervalMs: 600000
# Improvement 6: compact long sessions on the 1M-window Claude routes much earlier. The shipped default
# starts at 80 % of the window (~800k tokens); a 760k-token request failed at the provider transport
# on 2026-10-31 and the session died. 35 % (~350k) keeps a long agent session well clear of that.
# A config-only row for the base entry: no `name`, so it never inserts a second compaction backend.
# Smaller-window routes keep the shipped defaults. One JSON line, so the offline test can read it.
- id: compaction-basic
  config:
    modelPolicies: [{"provider": "claude", "model": "claude-opus-5-5", "thresholdRatio": 0.35, "retainRatio": 0.08}, {"provider": "claude", "model": "claude-opus-5", "thresholdRatio": 0.35, "retainRatio": 0.08}, {"provider": "claude", "model": "claude-sonnet-5", "thresholdRatio": 0.35, "retainRatio": 0.08}, {"provider": "claude", "model": "claude-fable-5", "thresholdRatio": 0.35, "retainRatio": 0.08}]
